name: Routing Base V1 offline CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

env:
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
  PIP_NO_INDEX: "1"
  PYTHONPATH: src

jobs:
  base-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Bootstrap pinned tools (network boundary)
        env: {PIP_NO_INDEX: "0"}
        run: python -m pip install "pytest==8.4.2"
      - name: Base routing contracts (offline)
        run: python -m pytest tests/test_routing_base_v1_contract.py tests/test_release_routing_decision.py tests/test_release_foundation_integration.py

  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Bootstrap pinned tools (network boundary)
        env: {PIP_NO_INDEX: "0"}
        run: python -m pip install "pytest==8.4.2"
      - name: Candidate and request-boundary safety (offline)
        run: python -m pytest tests/test_release_candidate_policy.py tests/test_release_temporary_packet_contract.py tests/test_v2619_routing_safety.py tests/test_lab73ds_mr_a_sensitive_path_exclusion.py

  package-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Bootstrap pinned tools (network boundary)
        env: {PIP_NO_INDEX: "0"}
        run: python -m pip install "setuptools==80.9.0" "wheel==0.45.1" "build==1.3.0" "pytest==8.4.2"
      - name: Build exact wheel offline
        run: python -m build --no-isolation --wheel
      - name: Exact wheel allowlist
        run: PREMODE_RELEASE_WHEEL="$(find dist -name '*.whl' -type f)" python -m pytest tests/test_release_install_contract.py
      - name: Installed CLI smoke
        run: |
          python -m venv /tmp/premode-installed
          /tmp/premode-installed/bin/pip install --no-index --no-deps dist/*.whl
          /tmp/premode-installed/bin/premode --version
          /tmp/premode-installed/bin/pcodex --help
          ! /tmp/premode-installed/bin/premode --help | grep -E 'benchmark|lab'
      - name: Installed lifecycle
        run: |
          mkdir -p /tmp/premode-fixture/src /tmp/premode-home
          printf '[project]\nname="fixture"\nversion="0"\n' > /tmp/premode-fixture/pyproject.toml
          printf 'def calculate_total(values):\n    return sum(values)\n' > /tmp/premode-fixture/src/app.py
          export HOME=/tmp/premode-home
          export PATH=/tmp/premode-installed/bin:/usr/bin:/bin
          pcodex setup --skip-tune --no-mcp --json --repo-root /tmp/premode-fixture | grep '"setup_status": "complete"'
          cd /tmp/premode-fixture
          pcodex status --json | grep '"status": "ok"'
          pcodex run --dry-run --json 'Change calculate_total.' | grep '"codex_launch": "not_executed"'
          mkdir -p .premode/index && printf '{}\n' > .premode/index/index.json
          pcodex cleanup --local-state --yes --json | grep '.premode/index'
          test ! -e .premode/index
          /tmp/premode-installed/bin/pip uninstall -y premode-router
          test ! -e /tmp/premode-installed/bin/premode
          /tmp/premode-installed/bin/pip install --no-index --no-deps "$GITHUB_WORKSPACE"/dist/*.whl
          /tmp/premode-installed/bin/premode --version

  bounded-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Bootstrap pinned tools (network boundary)
        env: {PIP_NO_INDEX: "0"}
        run: python -m pip install "pytest==8.4.2"
      - name: Deterministic no-model integration
        env:
          PREMODE_ALLOW_LIVE_MODEL: "0"
          PREMODE_ALLOW_EXTERNAL_FIXTURES: "0"
        run: python -m pytest tests/test_core_product_contract.py tests/test_lab73ar_pcodex_bootstrap.py tests/test_lab73at_pcodex_subagent_ui.py
