name: Release foundation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-foundation-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  TZ: UTC
  CODEX_VERSION: "0.143.0"
  OPENCLAW_VERSION: "2026.4.14"

jobs:
  test-matrix:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install pinned test and build dependencies
        run: python -m pip install --require-hashes -r requirements/release-test.lock
      - name: Install source without dependency resolution
        run: python -m pip install --no-deps --no-build-isolation .
      - name: Install and verify Codex runtime
        shell: bash
        run: |
          npm install --global --prefix "$RUNNER_TEMP/codex-npm" "@openai/codex@$CODEX_VERSION"
          echo "$RUNNER_TEMP/codex-npm/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/codex-npm/bin/codex" --version | grep -F "$CODEX_VERSION"
      - name: Install and verify OpenClaw runtime
        shell: bash
        run: |
          npm install --global --prefix "$RUNNER_TEMP/openclaw-npm" "openclaw@$OPENCLAW_VERSION"
          echo "$RUNNER_TEMP/openclaw-npm/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/openclaw-npm/bin/openclaw" --version | grep -F "$OPENCLAW_VERSION"
      - name: Compile production and qualification code
        run: python -m compileall -q -f src/premode scripts packages/premode-plugin-literal-symbol/src
      - name: Validate JSON and product manifests
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [Path("premode.product.json"), *sorted(Path("schemas").glob("*.json")), *sorted(Path("plugins/pcodex").rglob("*.json"))]:
              json.loads(path.read_text(encoding="utf-8"))
          PY
          python -c "from premode.product_contract import validate_installed_product_contract as v; assert v()['status']=='valid'"
      - name: Validate canonical documentation without executing examples
        run: python scripts/validate_documentation.py --root . --json
      - name: Run focused product, lifecycle, no-write, plugin, and packaging suites
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: ${{ github.workspace }}/src
        run: >-
          python -m pytest -q
          tests/test_product_contract.py
          tests/test_package_layout.py
          tests/test_productization_contract.py
          tests/test_documentation_contract.py
          tests/test_first_run_study.py
          tests/test_public_lifecycle.py
          tests/test_lab73dt_codex_native_ux_surface.py
          tests/no_write
      - name: Run complete repository suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m pytest -q
      - name: Run public hygiene and diff gates
        shell: bash
        run: |
          python scripts/check_public_hygiene.py --json
          git diff --check
          git diff --cached --check

  artifact-qualification:
    name: Artifacts (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: test-matrix
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install pinned build dependencies
        run: python -m pip install --require-hashes -r requirements/release-build.lock
      - name: Install and verify Codex runtime
        shell: bash
        run: |
          npm install --global --prefix "$RUNNER_TEMP/codex-npm" "@openai/codex@$CODEX_VERSION"
          echo "$RUNNER_TEMP/codex-npm/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/codex-npm/bin/codex" --version | grep -F "$CODEX_VERSION"
      - name: Install and verify OpenClaw runtime
        shell: bash
        run: |
          npm install --global --prefix "$RUNNER_TEMP/openclaw-npm" "openclaw@$OPENCLAW_VERSION"
          echo "$RUNNER_TEMP/openclaw-npm/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/openclaw-npm/bin/openclaw" --version | grep -F "$OPENCLAW_VERSION"
      - name: Build and qualify wheel and sdist outside checkout
        shell: bash
        run: |
          PYTHON_BIN="$(python -c 'import os,sys; print(os.path.realpath(sys.executable))')"
          python scripts/build_release_artifacts.py \
            --commit HEAD \
            --output "$RUNNER_TEMP/pcodex-qualification" \
            --python "$PYTHON_BIN" \
            --with-sdist
      - name: Verify machine-readable release evidence
        shell: bash
        run: |
          python scripts/validate_release_metadata.py "$RUNNER_TEMP/pcodex-qualification"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "pcodex-qualification"
          qualification = json.loads((root / "receipts/qualification-summary.json").read_text())
          assert qualification["status"] == "passed"
          assert qualification["wheel_sdist_parity"] == "passed"
          assert qualification["installed_lifecycle"] == {"wheel": True, "sdist": True}
          assert qualification["no_write"] == {"wheel": True, "sdist": True}
          assert qualification["upgrade_rollback"] == {
              "passed": True,
              "actual_predecessor_state_preserved": True,
              "actual_predecessor_check_no_write": True,
              "actual_predecessor_apply_status": "already_current",
              "receipt_compatibility_check_no_write": True,
              "receipt_compatibility_apply": "upgraded",
              "receipt_compatibility_current_idempotent": True,
              "post_mutation_rollback": True,
              "unsupported_downgrade_fail_closed": True,
              "uninstall_after_failed_upgrade": True,
              "reinstall_after_rollback_ready": True,
              "current_restore_ready": True,
              "advanced_state_preserved": True,
              "advanced_state_policy": "preserved_not_migrated",
          }
          assert qualification["openclaw_adapter"] == {
              "wheel": True,
              "sdist": True,
              "live_openclaw_version": "2026.4.14",
          }
          assert qualification["codex_plugin"] == {
              "wheel": True,
              "sdist": True,
              "live_codex_version": "0.143.0",
          }
          assert (root / "release/SBOM.cyclonedx.json").is_file()
          assert (root / "release/provenance.intoto.json").is_file()
          PY
      - name: Build and self-qualify the blind first-run study kit
        shell: bash
        run: |
          WHEELS=( "$RUNNER_TEMP/pcodex-qualification/artifacts/"*.whl )
          test "${#WHEELS[@]}" -eq 1
          PYTHON_BIN="$(python -c 'import os, sys; print(os.path.realpath(sys.executable))')"
          GIT_BIN="$(python -c 'import os, shutil; print(os.path.realpath(shutil.which("git") or ""))')"
          python scripts/build_first_run_study_kit.py \
            --output "$RUNNER_TEMP/first-run-study-kit" \
            --wheel "${WHEELS[0]}" \
            --qualification-root "$RUNNER_TEMP/pcodex-qualification" \
            --python "$PYTHON_BIN" \
            --git "$GIT_BIN" \
            --commit "$GITHUB_SHA"
      - name: Upload qualification evidence without publishing
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pcodex-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            ${{ runner.temp }}/pcodex-qualification
            ${{ runner.temp }}/first-run-study-kit
          if-no-files-found: error
          retention-days: 14

  static-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install pinned static tools
        run: python -m pip install --require-hashes -r requirements/release-security.lock
      - name: Lint and format qualification-critical Python
        run: |
          ruff check --select E9,F63,F7,F82 src/premode scripts tests
          ruff format --check src/premode/algorithm_handoff.py src/premode/bounded_mcp_runtime.py src/premode/openclaw_adapter.py src/premode/openclaw_contracts.py src/premode/openclaw_integration.py src/premode/openclaw_json5.py src/premode/openclaw_lifecycle.py src/premode/openclaw_mcp_server.py src/premode/openclaw_preflight.py src/premode/product_upgrade.py scripts/installed_openclaw_adapter_probe.py scripts/installed_tool_install_probe.py scripts/validate_tool_install_matrix.py scripts/validate_algorithm_handoff.py scripts/validate_release_metadata.py scripts/assemble_release_candidate.py scripts/validate_release_candidate.py scripts/compare_release_artifacts.py scripts/validate_documentation.py scripts/build_first_run_study_kit.py scripts/first_run_study_authority.py scripts/record_first_run_study.py scripts/restore_first_run_fixture.py scripts/validate_first_run_study.py tests/test_first_run_study.py
      - name: Type-check versioned product contracts
        run: mypy --ignore-missing-imports --follow-imports=skip src/premode/product_contract.py src/premode/product_upgrade.py src/premode/production_ranking.py src/premode/algorithm_handoff.py src/premode/bounded_mcp_runtime.py src/premode/openclaw_adapter.py src/premode/openclaw_contracts.py src/premode/openclaw_integration.py src/premode/openclaw_json5.py src/premode/openclaw_lifecycle.py src/premode/openclaw_mcp_server.py src/premode/openclaw_preflight.py scripts/build_first_run_study_kit.py scripts/first_run_study_authority.py scripts/record_first_run_study.py scripts/restore_first_run_fixture.py scripts/validate_first_run_study.py
      - name: Validate frozen production algorithm handoff
        run: PYTHONPATH=src python scripts/validate_algorithm_handoff.py
      - name: Run Python security analyzers
        run: |
          bandit -q -r src/premode scripts -lll -x src/premode/lab73ab_sharded.py,src/premode/live_token_harness.py,src/premode/sharded_runner.py
          pip-audit --strict --no-deps --disable-pip --cache-dir "$RUNNER_TEMP/pip-audit" \
            --format json --output "$RUNNER_TEMP/pip-audit.json" \
            -r requirements/release-build.lock
          pip-audit --strict --no-deps --disable-pip --cache-dir "$RUNNER_TEMP/pip-audit-tool-install" \
            --format json --output "$RUNNER_TEMP/pip-audit-tool-install.json" \
            -r requirements/release-tool-install.lock
          # Exact hash-authority field names are evidence, not credentials. Python
          # hash constants carry per-line allowlist pragmas and remain scanned.
          detect-secrets scan --exclude-lines '^(?:\s*"(?:sha256|commit_sha|tree_sha|freeze_sha256|provider_freeze_sha256|approved_algorithm_commit|previous_commit)"\s*:\s*"(?:[0-9a-f]{40}|[0-9a-f]{64})",?\s*|\s*"(?:approved_algorithm_commit|commit_sha|tree_sha|freeze_sha256|previous_commit)"\s*:\s*\{"const":\s*"(?:[0-9a-f]{40}|[0-9a-f]{64})"\},?\s*)$' \
            .github requirements schemas README.md premode.product.json \
            docs/GETTING_STARTED.md docs/CODEX_INTEGRATION.md \
            docs/OPENCLAW_INTEGRATION.md docs/TROUBLESHOOTING.md \
            docs/PRIVACY_AND_SAFETY.md docs/KNOWN_LIMITATIONS.md \
            docs/MIGRATION.md docs/ROLLBACK.md docs/UNINSTALL.md \
            src/premode/no_write.py src/premode/managed_state.py \
            src/premode/cli.py src/premode/production_ranking.py \
            src/premode/bounded_mcp_runtime.py src/premode/openclaw_adapter.py \
            src/premode/openclaw_contracts.py src/premode/openclaw_integration.py \
            src/premode/openclaw_json5.py src/premode/openclaw_lifecycle.py \
            src/premode/openclaw_mcp_server.py src/premode/openclaw_preflight.py \
            src/premode/algorithm_handoff.py src/premode/product_upgrade.py \
            scripts/validate_algorithm_handoff.py \
            scripts/assemble_release_candidate.py \
            scripts/validate_release_candidate.py \
            scripts/installed_tool_install_probe.py \
            scripts/validate_tool_install_matrix.py \
            scripts/review_dependency_locks.py \
            scripts/build_first_run_study_kit.py \
            scripts/first_run_study_authority.py \
            scripts/record_first_run_study.py \
            scripts/restore_first_run_fixture.py \
            scripts/validate_first_run_study.py \
            scripts/build_release_artifacts.py scripts/installed_no_write_probe.py \
            scripts/installed_openclaw_adapter_probe.py \
            release/algorithm-handoff.v1.json release/previous-supported.json \
            release/release-candidate-allowlist.json \
            > "$RUNNER_TEMP/detect-secrets.json"
          python -c "import json,os; d=json.load(open(os.environ['RUNNER_TEMP']+'/detect-secrets.json')); assert not d.get('results'), d.get('results')"
          semgrep scan --error --metrics=off --config security/semgrep-release.yml src/premode scripts
      - name: Upload scanner receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: static-security-receipts
          path: |
            ${{ runner.temp }}/detect-secrets.json
            ${{ runner.temp }}/pip-audit.json
            ${{ runner.temp }}/pip-audit-tool-install.json
          if-no-files-found: error

  history-secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Install pinned history scanners
        env:
          GOBIN: ${{ runner.temp }}/security-bin
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/trufflehog_3.95.9_linux_amd64.tar.gz" \
            https://github.com/trufflesecurity/trufflehog/releases/download/v3.95.9/trufflehog_3.95.9_linux_amd64.tar.gz
          echo "f6d1106b85107d79527ed7a5b98b592beadd8b770dc3c9e8c1ad99e1b2cf127e  $RUNNER_TEMP/trufflehog_3.95.9_linux_amd64.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/trufflehog_3.95.9_linux_amd64.tar.gz" \
            -C "$GOBIN" trufflehog
          echo "Expected Gitleaks module: github.com/zricethezav/gitleaks/v8@v8.30.1"
          "$GOBIN/gitleaks" version
          echo "Expected TruffleHog release asset: v3.95.9 (SHA-256 verified above)"
          "$GOBIN/trufflehog" --version
      - name: Run Gitleaks against full history
        run: >-
          "$RUNNER_TEMP/security-bin/gitleaks" git --redact --no-banner --exit-code 1 .
      - name: Run TruffleHog against full history
        run: >-
          "$RUNNER_TEMP/security-bin/trufflehog" git file://.
          --fail --no-update --results=verified,unknown,unverified

  dependency-review:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      - name: Review pinned dependency delta against the accepted campaign baseline
        if: github.event_name != 'pull_request'
        run: >-
          python scripts/review_dependency_locks.py
          --base 88b459ca79ebd04149bb0719405656df2c904292
          --output "$RUNNER_TEMP/dependency-lock-review.json"
          requirements/release-build.lock
          requirements/release-tool-install.lock
      - name: Upload non-PR dependency review receipt
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dependency-lock-review
          path: ${{ runner.temp }}/dependency-lock-review.json
          if-no-files-found: error

  reproducibility:
    needs: artifact-qualification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Download all matrix qualification evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: pcodex-*
          path: ${{ runner.temp }}/pcodex-matrix
      - name: Require identical wheel and sdist hashes across the supported matrix
        run: >-
          python scripts/compare_release_artifacts.py
          "$RUNNER_TEMP/pcodex-matrix"
          --output "$RUNNER_TEMP/reproducibility.json"
      - name: Upload reproducibility receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: reproducibility-receipt
          path: ${{ runner.temp }}/reproducibility.json
          if-no-files-found: error

  release-candidate:
    needs: [artifact-qualification, reproducibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install pinned release validation dependencies
        run: python -m pip install --require-hashes -r requirements/release-build.lock
      - name: Download all matrix qualification evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: pcodex-*
          path: ${{ runner.temp }}/pcodex-matrix
      - name: Download reproducibility authority
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: reproducibility-receipt
          path: ${{ runner.temp }}/pcodex-reproducibility
      - name: Assemble and independently rebuild the canonical RC
        shell: bash
        run: |
          python scripts/assemble_release_candidate.py \
            --matrix-root "$RUNNER_TEMP/pcodex-matrix" \
            --reproducibility "$RUNNER_TEMP/pcodex-reproducibility/reproducibility.json" \
            --source . \
            --output "$RUNNER_TEMP/pcodex-0.3.0b1-rc"
          python scripts/assemble_release_candidate.py \
            --matrix-root "$RUNNER_TEMP/pcodex-matrix" \
            --reproducibility "$RUNNER_TEMP/pcodex-reproducibility/reproducibility.json" \
            --source . \
            --output "$RUNNER_TEMP/pcodex-0.3.0b1-rc-rebuild"
          cmp "$RUNNER_TEMP/pcodex-0.3.0b1-rc.zip" \
            "$RUNNER_TEMP/pcodex-0.3.0b1-rc-rebuild.zip"
          python scripts/validate_release_candidate.py \
            "$RUNNER_TEMP/pcodex-0.3.0b1-rc" \
            --archive "$RUNNER_TEMP/pcodex-0.3.0b1-rc.zip" \
            > "$RUNNER_TEMP/release-candidate-validation.json"
      - name: Upload canonical RC without publishing
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pcodex-0.3.0b1-release-candidate
          path: |
            ${{ runner.temp }}/pcodex-0.3.0b1-rc
            ${{ runner.temp }}/pcodex-0.3.0b1-rc.zip
            ${{ runner.temp }}/release-candidate-validation.json
          if-no-files-found: error
          retention-days: 14

  tool-install:
    needs: release-candidate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install hash-locked pipx qualification and schema tools
        run: >-
          python -m pip install --require-hashes
          -r requirements/release-tool-install.lock
          -r requirements/release-build.lock
      - name: Download canonical RC
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: pcodex-0.3.0b1-release-candidate
          path: ${{ runner.temp }}/pcodex-rc
      - name: Qualify network-independent local-wheel-to-pipx lifecycle
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          WHEELS=( "$RUNNER_TEMP/pcodex-rc/pcodex-0.3.0b1-rc/artifacts/"*.whl )
          test "${#WHEELS[@]}" -eq 1
          PYTHON_BIN="$(python -c 'import sys; print(sys.executable)')"
          python scripts/installed_tool_install_probe.py \
            --wheel "${WHEELS[0]}" \
            --root "$RUNNER_TEMP/pcodex-pipx-probe" \
            --python "$PYTHON_BIN" \
            --output "$RUNNER_TEMP/tool-install-qualification.json"
      - name: Upload tool-install qualification
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tool-install-${{ matrix.os }}
          path: ${{ runner.temp }}/tool-install-qualification.json
          if-no-files-found: error
          retention-days: 14

  release-qualification-evidence:
    needs: [release-candidate, tool-install]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install pinned release validation dependencies
        run: python -m pip install --require-hashes -r requirements/release-build.lock
      - name: Download canonical RC
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: pcodex-0.3.0b1-release-candidate
          path: ${{ runner.temp }}/pcodex-rc
      - name: Download macOS and Linux tool-install receipts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: tool-install-*
          path: ${{ runner.temp }}/tool-install-matrix
      - name: Bind tool-install evidence to the canonical RC wheel
        shell: bash
        run: |
          EVIDENCE="$RUNNER_TEMP/release-qualification-evidence"
          mkdir -p "$EVIDENCE/tool-install-receipts"
          python scripts/validate_tool_install_matrix.py \
            --release-candidate "$RUNNER_TEMP/pcodex-rc/pcodex-0.3.0b1-rc" \
            --receipt-root "$RUNNER_TEMP/tool-install-matrix" \
            --output "$EVIDENCE/tool-install-matrix.json"
          cp "$RUNNER_TEMP/pcodex-rc/release-candidate-validation.json" \
            "$EVIDENCE/release-candidate-validation.json"
          cp -R "$RUNNER_TEMP"/tool-install-matrix/* \
            "$EVIDENCE/tool-install-receipts/"
      - name: Upload final non-published qualification evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pcodex-0.3.0b1-release-qualification
          path: ${{ runner.temp }}/release-qualification-evidence
          if-no-files-found: error
          retention-days: 14

  release-evidence:
    if: always()
    needs: [test-matrix, artifact-qualification, static-quality, history-secret-scan, dependency-review, reproducibility, release-candidate, tool-install, release-qualification-evidence]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every release qualification job
        env:
          TESTS: ${{ needs.test-matrix.result }}
          ARTIFACTS: ${{ needs.artifact-qualification.result }}
          STATIC: ${{ needs.static-quality.result }}
          SECRETS: ${{ needs.history-secret-scan.result }}
          REPRODUCIBILITY: ${{ needs.reproducibility.result }}
          RELEASE_CANDIDATE: ${{ needs.release-candidate.result }}
          TOOL_INSTALL: ${{ needs.tool-install.result }}
          FINAL_QUALIFICATION: ${{ needs.release-qualification-evidence.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$TESTS" = success
          test "$ARTIFACTS" = success
          test "$STATIC" = success
          test "$SECRETS" = success
          test "$REPRODUCIBILITY" = success
          test "$RELEASE_CANDIDATE" = success
          test "$TOOL_INSTALL" = success
          test "$FINAL_QUALIFICATION" = success
          test "$DEPENDENCY_REVIEW" = success
