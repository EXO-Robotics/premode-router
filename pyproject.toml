[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "premode-router"
version = "0.3.0b1"
description = "Local-first context compiler and privacy-safe Codex stdin wrapper."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Pre-mode Router"}]
license = {text = "Proprietary"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
premode = "premode.cli:main"
pcodex = "premode.pcodex_bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
premode = []

[tool.setuptools.data-files]
"share/premode-router" = ["premode.product.json"]
"share/premode-router/schemas" = ["schemas/*.json"]

[tool.setuptools.exclude-package-data]
"*" = [
  ".DS_Store",
  "__pycache__/*",
  "*.pyc",
  ".pytest_cache/*",
  ".premode/out/*",
  ".premode/audit/*",
  ".premode/metrics/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "external_fixtures: tests that require explicitly enabled local external repositories",
]
