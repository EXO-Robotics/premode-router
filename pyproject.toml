[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "premode-router"
dynamic = ["version"]
description = "Local-first context compiler and privacy-safe Codex stdin wrapper."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Pre-mode Router"}]
license = {text = "Proprietary"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
premode = "premode.cli:main"
pcodex = "premode.pcodex_bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "premode.__version__"}

[tool.setuptools.package-data]
premode = []

[tool.setuptools.data-files]
"share/premode-router" = ["premode.product.json"]
"share/premode-router/schemas" = ["schemas/*.json"]
"share/premode-router/release" = [
  "release/algorithm-handoff.v1.json",
  "release/previous-supported.json",
]
"share/premode-router/contracts/goldens" = [
  "contracts/goldens/agent-adapter-v1.json",
  "contracts/goldens/context-packet-v1.json",
  "contracts/goldens/context-receipt-v1.json",
  "contracts/goldens/packet-strategy-plugin-v1.json",
  "contracts/goldens/production-ranking-request-v1.json",
  "contracts/goldens/production-ranking-result-v1.json",
  "contracts/goldens/openclaw-preflight-request-v1.json",
  "contracts/goldens/openclaw-preflight-result-v1.json",
  "contracts/goldens/openclaw-preflight-receipt-v1.json",
]
"share/premode-router/plugins/pcodex/.codex-plugin" = ["plugins/pcodex/.codex-plugin/plugin.json"]
"share/premode-router/plugins/pcodex/assets" = ["plugins/pcodex/assets/README.md"]
"share/premode-router/plugins/pcodex/skills/pcodex" = ["plugins/pcodex/skills/pcodex/SKILL.md"]
"share/premode-router/plugins/pcodex/skills/pcodex/bin" = ["plugins/pcodex/skills/pcodex/bin/resolve-pcodex.sh"]
"share/premode-router/plugins/pcodex/skills/pcodex-dry-run" = ["plugins/pcodex/skills/pcodex-dry-run/SKILL.md"]
"share/premode-router/plugins/pcodex/skills/pcodex-status" = ["plugins/pcodex/skills/pcodex-status/SKILL.md"]
"share/premode-router/plugins/pcodex/skills/pcodex-tune" = ["plugins/pcodex/skills/pcodex-tune/SKILL.md"]

[tool.setuptools.exclude-package-data]
"*" = [
  ".DS_Store",
  "__pycache__/*",
  "*.pyc",
  ".pytest_cache/*",
  ".premode/out/*",
  ".premode/audit/*",
  ".premode/metrics/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "external_fixtures: tests that require explicitly enabled local external repositories",
]
