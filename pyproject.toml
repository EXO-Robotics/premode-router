[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "premode-router"
version = "0.2.6.16"
description = "Local-first context compiler and privacy-safe Codex stdin wrapper."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Pre-mode Router"}]
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
premode = "premode.cli:main"
pcodex = "premode.cli:pcodex_main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
